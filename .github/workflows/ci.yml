name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/hire_it
      SESSION_SECRET: ci-only-session-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Playwright placeholder discovery
        run: npm run test:e2e -- --list
      - name: Production build
        run: npm run build
